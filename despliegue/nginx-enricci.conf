# nginx delante del sitio: atiende internet, resuelve el certificado y le pasa
# los pedidos a Kestrel, que escucha sólo en loopback.
#
# Va en /etc/nginx/sites-available/enricci y se enlaza a sites-enabled.

# --- HTTP: sólo para renovar el certificado y mandar todo a HTTPS -------------
server {
    listen 80;
    listen [::]:80;
    server_name enricci-propiedades.com.ar www.enricci-propiedades.com.ar;

    # Let's Encrypt valida por acá. Tiene que quedar accesible por HTTP: si se
    # redirige también esto, la renovación automática falla.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.enricci-propiedades.com.ar$request_uri;
    }
}

# --- HTTPS sin www: manda al dominio con www ---------------------------------
# Una sola dirección para el sitio. Si respondiera igual en las dos, los
# buscadores verían la misma página publicada dos veces.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name enricci-propiedades.com.ar;

    ssl_certificate     /etc/letsencrypt/live/enricci-propiedades.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enricci-propiedades.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.enricci-propiedades.com.ar$request_uri;
}

# --- El sitio ----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.enricci-propiedades.com.ar;

    ssl_certificate     /etc/letsencrypt/live/enricci-propiedades.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enricci-propiedades.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # IMPORTANTE: el panel acepta hasta 12 fotos de 20 MB en una sola tanda y el
    # límite de nginx viene en 1 MB. Sin esta línea, subir fotos falla con un
    # 413 antes de que el sitio llegue a enterarse.
    client_max_body_size 160M;

    # No anunciar la versión de nginx.
    server_tokens off;

    # El registro de acceso sirve para ver qué pasa; el de errores, para saber
    # por qué algo no anduvo.
    access_log /var/log/nginx/enricci-access.log;
    error_log  /var/log/nginx/enricci-error.log;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Sin estas cabeceras el sitio cree que todos los pedidos llegan por HTTP
        # desde 127.0.0.1: las URL canónicas saldrían mal y el freno por IP de la
        # pantalla de ingreso agruparía a todos los visitantes en uno solo.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_cache_bypass $http_upgrade;

        # Subir una tanda de fotos y procesarlas lleva su tiempo.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # El sitio ya comprime lo que tiene que comprimir; nginx sólo pasa el
        # cuerpo tal cual llega.
        proxy_buffering off;
    }
}
